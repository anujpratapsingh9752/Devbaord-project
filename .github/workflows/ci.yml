# Goal - I have to lint, build, test the code for frontend and backend
# Then push the images to dockerhub

name: CI

on:
    push:
        branches: [advanced]

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Use Node.js 
              uses: actions/setup-node@v6
              with:
                node-version: "20"
                cache: 'npm' # Automates package caching for faster subsequent runs 
                cache-dependency-path: 'frontend/package-lock.json'

            - name: Install npm packages
              run: npm install
              working-directory: frontend

            - name: Run linter 
              run: npm run lint
              working-directory: frontend

            - name: Run Tests
              run: npm run test
              working-directory: frontend

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

        ## Build the Dockerfile and push the image to Docker Hub
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest


    
