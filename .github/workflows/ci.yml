# Goal - I have to lint, build, test the code for frontend and backend
# Then push the images to dockerhub

name: CI

on:
    workflow_dispatch:

jobs:
    frontend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Use Node.js 
              uses: actions/setup-node@v6
              with:
                node-version: "20"
                cache: 'npm' # Automates package caching for faster subsequent runs 
                cache-dependency-path: 'frontend/package-lock.json'

            - name: Install npm packages
              run: npm install
              working-directory: frontend

            - name: Run linter 
              run: npm run lint
              working-directory: frontend

            - name: Run Tests
              run: npm run test
              working-directory: frontend

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

        ## Build the Dockerfile and push the image to Docker Hub
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                context: ./frontend
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/devboard-frontend:latest

    backend:
      needs: [frontend]
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Setup Go
          uses: actions/setup-go@v6
          with:
            go-version: "1.23"
            cache: true
            cache-dependency-path: backend/go.sum

        - name: Install Project Dependencies
          run: go mod download
          working-directory: backend

        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@v6
          with:
            version: latest
            args: ./...
            working-directory: backend

        - name: Run Tests
          run: go test -v -race -cover ./...
          working-directory: backend

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and Push Docker Image
          uses: docker/build-push-action@v7
          with:
            context: ./backend
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/devboard-backend:latest

    deploy:
